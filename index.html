<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Quote Stream</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#faf9f6;color:#1c1c1c;overflow-x:hidden;max-width:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
body::before,body::after{content:"";flex:1 1 auto}
main{flex:0 0 auto;max-width:min(60rem,100%);padding:calc(1.75rem + env(safe-area-inset-top,0px)) max(1.25rem,env(safe-area-inset-right,0px)) calc(5.5rem + env(safe-area-inset-bottom,0px)) max(1.25rem,env(safe-area-inset-left,0px));box-sizing:border-box;width:100%;text-align:center;transition:opacity .5s}
.fig{margin:0 auto 1.35rem;width:min(100%,calc(32dvh * 1.5),34rem);max-width:100%;aspect-ratio:3/2;position:relative;overflow:hidden}
.fig[hidden]{display:none}
.fig img{width:100%;height:100%;object-fit:cover;display:block}
.fig::after{content:"";position:absolute;left:0;right:0;bottom:0;height:14%;background:linear-gradient(to bottom,transparent,#faf9f6);pointer-events:none}
blockquote{cursor:pointer;margin:0 auto;max-width:min(var(--mw,38ch),100%);font:400 var(--fs,clamp(2rem,5.5vw,3.4rem))/var(--lh,1.3) 'Cormorant Garamond',Georgia,serif;text-wrap:pretty;overflow-wrap:break-word}
blockquote p{margin:0 0 .9em}blockquote p:last-child{margin-bottom:0}
.long blockquote{text-align:left}
#more{display:grid;place-items:center;min-width:44px;min-height:44px;margin:.35rem auto 0;padding:0;background:none;border:0;color:#bbb;font-size:1rem;cursor:pointer;transition:transform .3s;touch-action:manipulation;-webkit-appearance:none;appearance:none}
#more.open{transform:rotate(180deg)}
#x{display:none;text-align:left;margin:2.5rem auto 0;max-width:min(65ch,100%);font:400 17.5px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;font-style:normal;letter-spacing:normal;text-transform:none;overflow-wrap:break-word}
#x p{margin:0 0 1em}#x li{margin-bottom:.4em}
#x.open{display:block}
#x h4{font:600 17.5px/1.6 inherit;font-family:inherit;color:inherit;margin:2rem 0 .5rem}
#x ul{padding-left:1.1rem}#x a{color:inherit}
.cred{margin:0 0 1.35rem;font:300 11px/1.45 Inter,sans-serif;letter-spacing:.03em;color:#a3a3a3;text-align:center}
.cred a{color:inherit;text-decoration:none}
.cred a:hover{text-decoration:underline}
cite{display:block;margin-top:2rem;font:300 clamp(.95rem,2vw,1.15rem)/1.4 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#888;font-style:normal}
cite i{text-transform:none;letter-spacing:0;font-family:'Cormorant Garamond',serif;font-size:1.25em}
#next{position:fixed;z-index:2;right:max(2rem,env(safe-area-inset-right,0px));bottom:calc(2rem + env(safe-area-inset-bottom,0px));width:48px;height:48px;padding:0;background:transparent;border:0;color:#8a8a8a;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
#next svg{display:block;width:100%;height:100%}
#next circle,#next path{fill:none;stroke:currentColor;vector-effect:non-scaling-stroke}
#next circle{stroke-width:1px}
#next path{stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round}
#next:hover,#next:focus-visible{color:#5c5c5c}
#next:focus{outline:none}
#next:focus-visible{outline:1px solid currentColor;outline-offset:4px}
@media(max-width:640px){
  .fig{width:min(100%,calc(28dvh * 1.5),34rem)}
}
@media(prefers-color-scheme:dark){
  html,body{background:#121212;color:#e8e6e1}
  .fig::after{background:linear-gradient(to bottom,transparent,#121212)}
  .cred{color:#8a8a8a}
  #next{color:#aaa}
  #next:hover,#next:focus-visible{color:#c8c8c8}
}
</style></head><body>
<main id="m"><figure class="fig" id="fig" hidden><img id="img" alt=""></figure><blockquote id="q"></blockquote><cite id="a"></cite><button id="more" aria-label="More">&#8964;</button><section id="x"></section></main>
<button id="next" aria-label="Next"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22.5"/><path d="M8 24h32M28 11.5 40 24 28 36.5"/></svg></button>
<script>
let qs=[],i=0,imgs={};
const x_=document.getElementById('x');const m=document.getElementById('m');
const fig=document.getElementById('fig');const img=document.getElementById('img');
const sh=a=>{for(let j=a.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[a[j],a[k]]=[a[k],a[j]]}return a};
function esc(s){const d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function imageKey(author,quote){const words=String(quote).trim().split(/\s+/).slice(0,8).join(' ');return author+' '+words}
function credit(meta){if(!meta)return '';const bits=[meta.title,meta.artist,meta.year].filter(Boolean);let line=bits.join(' · ');if(meta.license&&!/public domain/i.test(meta.license))line+=(line?' · ':'')+meta.license;if(!line)return '';const href=meta.source_url?' href="'+esc(meta.source_url)+'" target="_blank" rel="noopener"':'';return '<p class="cred"><a'+href+'>'+esc(line)+'</a></p>'}
function reveal(){m.style.opacity=1}
function paintImage(meta){img.onload=null;img.onerror=null;if(!meta||!meta.file){fig.hidden=true;img.removeAttribute('src');img.alt='';return}fig.hidden=false;img.alt=[meta.title,meta.artist].filter(Boolean).join(', ');if(img.getAttribute('src')!==meta.file)img.src=meta.file;img.onerror=()=>{fig.hidden=true}}
function show(){const x=qs[i];x_.classList.remove('open');more.classList.remove('open');const meta=imgs[imageKey(x.author,x.quote)];paintImage(meta);const ps=String(x.quote).trim().split(/\n\s*\n/);q.innerHTML=ps.map((p,k)=>'<p>'+(k?'':'\u201C')+esc(p).replace(/\n/g,'<br>')+(k==ps.length-1?'\u201D':'')+'</p>').join('');
const w=String(x.quote).split(/\s+/).length,S=q.style;m.classList.toggle('long',w>45);
if(w<=20){S.setProperty('--fs','clamp(2rem,5.5vw,3.4rem)');S.setProperty('--lh','1.3');S.setProperty('--mw','38ch')}
else if(w<=45){S.setProperty('--fs','clamp(1.6rem,4vw,2.5rem)');S.setProperty('--lh','1.4');S.setProperty('--mw','44ch')}
else if(w<=110){S.setProperty('--fs','clamp(1.3rem,2.8vw,1.85rem)');S.setProperty('--lh','1.5');S.setProperty('--mw','54ch')}
else{S.setProperty('--fs','clamp(1.15rem,2.2vw,1.5rem)');S.setProperty('--lh','1.55');S.setProperty('--mw','60ch')}a.innerHTML='';a.append('— '+x.author);if(x.work){const s=document.createElement('i');s.textContent=', '+x.work;a.append(s)}
const ex=Array.isArray(x.expansion)?x.expansion:(x.expansion||'').split(/\n\n+/);more.style.display=ex.length&&ex[0]?'':'none';
x_.innerHTML=credit(meta)+ex.map(p=>'<p>'+esc(p)+'</p>').join('')+((x.sources||[]).length?'<h4>Further reading</h4><ul>'+x.sources.map(s=>'<li><a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.title)+'</a>'+(s.author?' — '+esc(s.author):'')+'</li>').join('')+'</ul>':'')}
function toggle(){x_.classList.toggle('open');more.classList.toggle('open')}
function next(){if(!qs.length)return;m.style.opacity=0;setTimeout(()=>{scrollTo(0,0);i++;if(i>=qs.length){sh(qs);i=0}show();if(fig.hidden||img.complete)reveal();else{img.addEventListener('load',reveal,{once:true});img.addEventListener('error',reveal,{once:true})}},400)}
Promise.all([
  fetch('quotes.json').then(r=>r.json()),
  fetch('data/images.json').then(r=>r.ok?r.json():{})
]).then(([d,im])=>{imgs=im||{};qs=sh(d);m.style.opacity=0;show();if(fig.hidden||img.complete)reveal();else{img.addEventListener('load',reveal,{once:true});img.addEventListener('error',reveal,{once:true})}});
q.addEventListener('click',toggle);more.addEventListener('click',toggle);document.getElementById('next').addEventListener('click',next);
addEventListener('keydown',e=>{if(e.key==='Escape'&&x_.classList.contains('open'))toggle();if(e.key==='Enter')toggle();if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}});
</script></body></html>
